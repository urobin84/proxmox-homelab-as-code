---
# =============================================================================
# Role: proxmox_terraform_access - user, role & API token untuk Terraform
# Secret token hanya keluar sekali saat dibuat → langsung disimpan ke
# Keychain Mac (no_log). Jika secret di Keychain hilang, token dibuat ulang.
# =============================================================================

- name: Role Terraform dengan privilege minimum
  ansible.builtin.shell: |
    set -euo pipefail
    want='{{ tf_pve_privileges | sort | join(",") }}'
    if pveum role list --output-format json | python3 -c "import json,sys; sys.exit(0 if any(r['roleid']=='{{ tf_pve_role }}' for r in json.load(sys.stdin)) else 1)"; then
      have=$(pveum role list --output-format json | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin) if x['roleid']=='{{ tf_pve_role }}'][0]; p=r['privs']; p=p.split(',') if isinstance(p,str) else p; print(','.join(sorted(p)))")
      [ "$have" = "$want" ] && exit 0
      pveum role modify {{ tf_pve_role }} --privs "$want"
    else
      pveum role add {{ tf_pve_role }} --privs "$want"
    fi
    echo CHANGED
  args:
    executable: /bin/bash
  register: tf_role
  changed_when: "'CHANGED' in tf_role.stdout"

- name: User Terraform (realm pve, tanpa password)
  ansible.builtin.shell: |
    pveum user list --output-format json | python3 -c "import json,sys; sys.exit(0 if any(u['userid']=='{{ tf_pve_user }}' for u in json.load(sys.stdin)) else 1)" && exit 0
    pveum user add {{ tf_pve_user }} --comment "Terraform IaC (dikelola Ansible role proxmox_terraform_access)" && echo CHANGED
  register: tf_user
  changed_when: "'CHANGED' in tf_user.stdout"

# Token privsep=1: hak efektif = irisan ACL user & ACL token (token di akhir)
- name: ACL role Terraform untuk user
  ansible.builtin.command:
    cmd: "pveum acl modify / --roles {{ tf_pve_role }} --users {{ tf_pve_user }}"
  changed_when: false

- name: Cek token di Proxmox
  ansible.builtin.shell: |
    pveum user token list {{ tf_pve_user }} --output-format json | python3 -c "import json,sys; sys.exit(0 if any(t['tokenid']=='{{ tf_pve_token_name }}' for t in json.load(sys.stdin)) else 1)"
  register: tf_token_check
  changed_when: false
  failed_when: false

- name: Cek secret token di Keychain Mac
  ansible.builtin.command:
    cmd: "security find-generic-password -a '{{ tf_keychain_account }}' -s '{{ tf_keychain_service }}'"
  delegate_to: localhost
  become: false
  register: tf_keychain_check
  changed_when: false
  failed_when: false

- name: Buat (ulang) token & simpan secret ke Keychain
  when: tf_token_check.rc != 0 or tf_keychain_check.rc != 0
  block:
    - name: Hapus token lama (secret tidak tersimpan)
      ansible.builtin.command:
        cmd: "pveum user token remove {{ tf_pve_user }} {{ tf_pve_token_name }}"
      when: tf_token_check.rc == 0

    - name: Buat API token
      ansible.builtin.command:
        cmd: >-
          pveum user token add {{ tf_pve_user }} {{ tf_pve_token_name }}
          --privsep 1 --comment "Terraform IaC" --output-format json
      register: tf_token_new
      no_log: true

    - name: Simpan secret token ke Keychain Mac
      ansible.builtin.command:
        argv:
          - security
          - add-generic-password
          - -U
          - -a
          - "{{ tf_keychain_account }}"
          - -s
          - "{{ tf_keychain_service }}"
          - -w
          - "{{ (tf_token_new.stdout | from_json).value }}"
      delegate_to: localhost
      become: false
      no_log: true

- name: ACL role Terraform untuk token
  ansible.builtin.command:
    cmd: "pveum acl modify / --roles {{ tf_pve_role }} --tokens {{ tf_pve_user }}!{{ tf_pve_token_name }}"
  changed_when: false
