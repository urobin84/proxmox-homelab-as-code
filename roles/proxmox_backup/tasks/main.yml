---
# =============================================================================
# Role: proxmox_backup - backup semua LXC dari host pve
#   - Storage BackupFolder: is_mountpoint + retensi
#   - Backup job vzdump harian → BackupFolder (HDD NTFS)
#   - Bersihkan sisa offsite Google Drive (dipensiunkan)
# Storage & mount NTFS dibuat manual - tidak diubah.
# =============================================================================

- name: Pastikan HDD backup ter-mount
  ansible.builtin.command:
    cmd: mountpoint -q {{ proxmox_backup_storage_path }}
  changed_when: false

# ---------------------------------------------------------------------------
# Offsite Google Drive dipensiunkan - hapus unit, script & kredensial rclone
# ---------------------------------------------------------------------------
- name: Hentikan unit offsite Google Drive
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop:
    - homelab-offsite.timer
    - homelab-offsite.service
    - rclone-gdrive.service
  register: offsite_stop
  failed_when: offsite_stop is failed and 'Could not find' not in (offsite_stop.msg | default(''))

- name: Hapus file offsite Google Drive
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/homelab-offsite.service
    - /etc/systemd/system/homelab-offsite.timer
    - /etc/systemd/system/rclone-gdrive.service
    - /usr/local/sbin/homelab-offsite.sh
    - /root/.config/rclone/rclone.conf        # token OAuth & password crypt
    - /var/lib/homelab/offsite-last-success
    - /usr/bin/rclone
    - /usr/local/share/man/man1/rclone.1
  register: offsite_files

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes
  when: offsite_files is changed

# ---------------------------------------------------------------------------
# Storage + backup job (via pvesh)
# ---------------------------------------------------------------------------
- name: Deploy script konfigurasi backup Proxmox
  ansible.builtin.template:
    src: homelab-backup-config.py.j2
    dest: /usr/local/sbin/homelab-backup-config.py
    mode: '0700'
  register: deploy_backup_script

# Saat --check: script tetap dijalankan dalam mode baca-saja (laporkan diff)
- name: Terapkan storage & backup job
  ansible.builtin.command:
    cmd: "/usr/local/sbin/homelab-backup-config.py {{ '--check' if ansible_check_mode else '' }}"
  register: backup_config_result
  changed_when: "'CHANGED' in backup_config_result.stdout"
  check_mode: false
  when: not (ansible_check_mode and deploy_backup_script is changed)

- name: Tampilkan perubahan konfigurasi backup
  ansible.builtin.debug:
    var: backup_config_result.stdout_lines
  when: backup_config_result is changed

# Setelah storage gdrive_backup dihapus (Proxmox tidak membuat ulang dump/).
# rmdir gagal jika tidak kosong - isi direktori tidak pernah dihapus paksa
- name: Hapus direktori offsite yang kosong
  ansible.builtin.command:
    cmd: rmdir {{ item }}
    removes: "{{ item }}"
  loop:
    - /mnt/gdrive/dump
    - /mnt/gdrive
    - /root/.config/rclone
    - /var/lib/homelab
