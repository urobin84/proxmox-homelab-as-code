---
# =============================================================================
# Hanya perbarui konfigurasi Prometheus & reload tanpa restart (lifecycle API).
# Dipakai failover-db.yml agar target probe DB langsung mengikuti db_host baru,
# lewat include_tasks + vars_files defaults (tanpa dependency role docker).
# =============================================================================
- name: Perbarui prometheus.yml
  ansible.builtin.template:
    src: "{{ role_path | default(repo_root ~ '/roles/monitoring') }}/templates/prometheus.yml.j2"
    dest: "{{ monitoring_base_dir }}/prometheus/prometheus.yml"
    mode: '0644'
  register: prom_config

- name: Reload Prometheus (tanpa restart)
  ansible.builtin.command:
    cmd: docker exec prometheus wget -qO- --post-data='' http://localhost:9090/-/reload
  when: prom_config is changed
