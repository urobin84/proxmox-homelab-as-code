---
- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  listen: "Restart fail2ban"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Restart node exporter
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    state: restarted
  listen: "Restart node exporter"
