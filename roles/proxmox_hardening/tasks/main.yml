---
# =============================================================================
# Role: proxmox_hardening - host pve (Debian 13, Proxmox VE 9)
#   - SSH key-only (role ssh_hardening) - Shell di Web UI tetap bisa dipakai
#   - fail2ban: SSH + login Web UI
#   - node exporter + metrics backup/thin pool (textfile collector)
#   - rule pve-firewall untuk scrape dari LXC 106
# =============================================================================

# Override manual di /etc/hosts memaku repo Proxmox ke IP CDN lama yang mati
# → host tidak pernah menerima update Proxmox. Biarkan DNS yang menentukan.
- name: Hapus override /etc/hosts untuk repo Proxmox
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^\s*[0-9a-fA-F.:]+\s+(.*\s)?(download|enterprise)\.proxmox\.com(\s|$)'
    state: absent
    backup: yes

# Sisa build ISO installer (mmdebstrap) - mematikan pengecekan kedaluwarsa
# metadata repo, sehingga mirror basi/replay attack tidak terdeteksi
- name: Aktifkan lagi pengecekan kedaluwarsa metadata apt
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/99mmdebstrap
    regexp: '^\s*Acquire::Check-Valid-Until'
    state: absent

# Satu repo yang down (mis. download.proxmox.com) tidak boleh menggagalkan
# role - paket di bawah berasal dari repo Debian
- name: Update apt cache (toleran terhadap repo yang down)
  ansible.builtin.command:
    cmd: apt-get update -q
  register: pve_apt_update
  changed_when: false
  failed_when: false

- name: Peringatan repo apt gagal diakses
  ansible.builtin.debug:
    msg: "{{ pve_apt_update.stdout_lines | select('search', '^(Err|W:)') | list }}"
  when: pve_apt_update.stdout is search('(?m)^(Err|W:)')

- name: Install paket hardening & monitoring host
  ansible.builtin.apt:
    name:
      - fail2ban
      - python3-systemd
      - prometheus-node-exporter
    state: present

# Ikut terpasang lewat node-exporter-collectors → ipmitool; laptop tanpa IPMI
- name: Matikan openipmi (tidak ada IPMI di host ini)
  ansible.builtin.systemd:
    name: openipmi.service
    enabled: no
    masked: yes
  register: openipmi_mask
  failed_when: openipmi_mask is failed and 'Could not find' not in (openipmi_mask.msg | default(''))

- name: SSH hardening
  ansible.builtin.include_role:
    name: ssh_hardening

# ---------------------------------------------------------------------------
# fail2ban
# ---------------------------------------------------------------------------
- name: Deploy filter fail2ban login Web UI Proxmox
  ansible.builtin.copy:
    dest: /etc/fail2ban/filter.d/proxmox.conf
    content: |
      # Dikelola Ansible (role proxmox_hardening)
      [Definition]
      failregex = pvedaemon\[.*authentication failure; rhost=(?:::ffff:)?<HOST> user=.* msg=.*
      ignoreregex =
    mode: '0644'
  notify: Restart fail2ban

- name: Deploy konfigurasi fail2ban
  ansible.builtin.template:
    src: fail2ban-jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: '0644'
  notify: Restart fail2ban

# Log ban/unban masuk journald → ikut terkirim ke Loki (role log_agent)
- name: Arahkan log fail2ban ke journald
  ansible.builtin.copy:
    dest: /etc/fail2ban/fail2ban.local
    content: |
      # Dikelola Ansible
      [DEFAULT]
      logtarget = SYSTEMD-JOURNAL
    mode: '0644'
  notify: Restart fail2ban

# Tanpa ini kernel membuang log netfilter dari namespace LXC, sehingga log
# "[UFW BLOCK]" semua LXC tidak tercatat di mana pun. Dengan ini log tersebut
# masuk journal kernel pve (dibatasi rate-limit UFW "logging low").
- name: Izinkan log firewall dari namespace LXC (UFW) tercatat di host
  ansible.posix.sysctl:
    name: net.netfilter.nf_log_all_netns
    value: "1"
    sysctl_file: /etc/sysctl.d/90-homelab-netfilter-log.conf
    sysctl_set: yes
    state: present

- name: Aktifkan & start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: yes
    state: started
  ignore_errors: "{{ ansible_check_mode }}"

# ---------------------------------------------------------------------------
# node exporter + metrics backup
# ---------------------------------------------------------------------------
- name: Buat direktori textfile & state
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ pve_textfile_dir }}"
    - "{{ homelab_state_dir }}"

# Default paket Debian mengecualikan /mnt dari metrics filesystem, padahal
# HDD backup (/mnt/pve/proxmox-target) & Google Drive (/mnt/gdrive) ada di sana
- name: Argumen node exporter - sertakan mount di /mnt
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    content: |
      # Dikelola Ansible (role proxmox_hardening)
      ARGS='--collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|media|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)'
    mode: '0644'
  notify: Restart node exporter

- name: Deploy script metrics homelab
  ansible.builtin.template:
    src: homelab-metrics.sh.j2
    dest: /usr/local/sbin/homelab-metrics.sh
    mode: '0755'

- name: Deploy systemd service & timer metrics
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    mode: '0644'
  loop:
    - name: homelab-metrics.service
      content: |
        # Dikelola Ansible (role proxmox_hardening)
        [Unit]
        Description=Metrics status backup homelab untuk Prometheus

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/homelab-metrics.sh
    - name: homelab-metrics.timer
      content: |
        # Dikelola Ansible (role proxmox_hardening)
        [Unit]
        Description=Jadwal metrics status backup homelab

        [Timer]
        OnBootSec=2min
        OnUnitActiveSec={{ pve_metrics_interval }}

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  register: metrics_units

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes
  when: metrics_units is changed

- name: Aktifkan timer metrics & node exporter
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: yes
    state: started
  loop:
    - homelab-metrics.timer
    - prometheus-node-exporter
  ignore_errors: "{{ ansible_check_mode }}"

# ---------------------------------------------------------------------------
# pve-firewall - rule dicocokkan lewat comment agar idempotent
# ---------------------------------------------------------------------------
- name: Baca rule pve-firewall
  ansible.builtin.command:
    cmd: pvesh get /cluster/firewall/rules --output-format json
  register: pve_fw_rules
  changed_when: false
  check_mode: false

- name: Tambah rule pve-firewall
  ansible.builtin.command:
    cmd: >-
      pvesh create /cluster/firewall/rules --type in --action ACCEPT --enable 1
      --proto tcp --dport {{ item.dport }} --source {{ item.source }}
      --comment "{{ item.comment }}"
  loop: "{{ pve_firewall_rules }}"
  loop_control:
    label: "{{ item.comment }}"
  when: item.comment not in (pve_fw_rules.stdout | from_json | map(attribute='comment', default='') | list)
