---
# =============================================================================
# Role: pgbackrest_db - arsip WAL & akses backup di host PostgreSQL
#   - archive-push asinkron ke repository host (LXC 106) via SSH
#   - restore_command: replika bisa mengejar dari arsip jika slot terlewat
#   - SSH dua arah dibatasi IP sumber, tanpa forwarding/PTY
# Tidak ada kunci enkripsi di sini - enkripsi dilakukan di repository host.
# =============================================================================

- name: Install pgBackRest
  ansible.builtin.apt:
    name: pgbackrest
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Direktori spool (arsip asinkron) & log
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0750'
  loop:
    - /var/spool/pgbackrest
    - /var/log/pgbackrest

- name: Konfigurasi klien pgBackRest
  ansible.builtin.copy:
    dest: /etc/pgbackrest.conf
    content: |
      # Dikelola Ansible (role pgbackrest_db) - repositori di {{ pgbackrest_repo_host }}
      [global]
      repo1-host={{ hostvars[pgbackrest_repo_host].ansible_host }}
      repo1-host-user={{ pgbackrest_repo_user }}
      archive-async=y
      spool-path=/var/spool/pgbackrest
      compress-type=zst
      process-max=2
      log-level-console=info
      log-level-file=detail

      [{{ pgbackrest_stanza }}]
      pg1-path={{ pgbackrest_pg_path }}
    owner: root
    group: postgres
    mode: '0640'

# ---------------------------------------------------------------------------
# SSH: postgres@db → pgbackrest@repo (archive-push/get)
#      pgbackrest@repo → postgres@db (backup/stanza/check)
# ---------------------------------------------------------------------------
- name: SSH key user postgres
  ansible.builtin.user:
    name: postgres
    generate_ssh_key: yes
    ssh_key_type: ed25519
    ssh_key_comment: "postgres@{{ inventory_hostname }}"
  register: pg_ssh_key

- name: Baca public key pgbackrest di repository host
  ansible.builtin.slurp:
    src: "/home/{{ pgbackrest_repo_user }}/.ssh/id_ed25519.pub"
  delegate_to: "{{ pgbackrest_repo_host }}"
  register: repo_pubkey

- name: Izinkan pgbackrest@repo login sebagai postgres (hanya dari IP repo)
  ansible.posix.authorized_key:
    user: postgres
    key: "{{ repo_pubkey.content | b64decode }}"
    key_options: 'from="{{ hostvars[pgbackrest_repo_host].ansible_host }}",no-agent-forwarding,no-X11-forwarding,no-port-forwarding,no-pty'

- name: Izinkan postgres@db login sebagai pgbackrest di repo (hanya dari IP db)
  ansible.posix.authorized_key:
    user: "{{ pgbackrest_repo_user }}"
    key: "{{ pg_ssh_key.ssh_public_key }}"
    key_options: 'from="{{ ansible_host }}",no-agent-forwarding,no-X11-forwarding,no-port-forwarding,no-pty'
  delegate_to: "{{ pgbackrest_repo_host }}"

- name: Host key repository host
  ansible.builtin.command:
    cmd: "ssh-keyscan -t ed25519 {{ hostvars[pgbackrest_repo_host].ansible_host }}"
  register: repo_hostkey
  changed_when: false

- name: known_hosts postgres → repo
  ansible.builtin.known_hosts:
    path: /var/lib/postgresql/.ssh/known_hosts
    name: "{{ hostvars[pgbackrest_repo_host].ansible_host }}"
    key: "{{ repo_hostkey.stdout_lines | select('search', 'ssh-ed25519') | first }}"
  become_user: postgres

- name: Host key host database ini
  ansible.builtin.command:
    cmd: "ssh-keyscan -t ed25519 {{ ansible_host }}"
  delegate_to: "{{ pgbackrest_repo_host }}"
  register: db_hostkey
  changed_when: false

- name: known_hosts pgbackrest → db
  ansible.builtin.known_hosts:
    path: "/home/{{ pgbackrest_repo_user }}/.ssh/known_hosts"
    name: "{{ ansible_host }}"
    key: "{{ db_hostkey.stdout_lines | select('search', 'ssh-ed25519') | first }}"
  delegate_to: "{{ pgbackrest_repo_host }}"
  become_user: "{{ pgbackrest_repo_user }}"

- name: Uji SSH postgres → pgbackrest@repo
  ansible.builtin.command:
    cmd: "runuser -u postgres -- ssh -o BatchMode=yes {{ pgbackrest_repo_user }}@{{ hostvars[pgbackrest_repo_host].ansible_host }} pgbackrest version"
  changed_when: false

# ---------------------------------------------------------------------------
# Stanza dibuat SEBELUM archive_mode aktif (archive-push butuh stanza)
# run_once: berjalan setelah SSH kedua host DB siap (strategi linear)
# ---------------------------------------------------------------------------
- name: Buat / perbarui stanza di repository host
  ansible.builtin.command:
    cmd: "pgbackrest --stanza={{ pgbackrest_stanza }} stanza-create"
  become_user: "{{ pgbackrest_repo_user }}"
  delegate_to: "{{ pgbackrest_repo_host }}"
  run_once: true
  register: stanza_create
  changed_when: "'already exists' not in stanza_create.stdout + stanza_create.stderr"

# ---------------------------------------------------------------------------
# Arsip WAL (archive_mode butuh RESTART PostgreSQL)
# ---------------------------------------------------------------------------
- name: Konfigurasi arsip WAL & restore_command
  ansible.builtin.copy:
    dest: "/etc/postgresql/{{ postgres_version }}/main/conf.d/85-ansible-pitr.conf"
    content: |
      # Dikelola Ansible (role pgbackrest_db) - PITR via pgBackRest
      archive_mode = on
      archive_command = 'pgbackrest --stanza={{ pgbackrest_stanza }} archive-push %p'
      archive_timeout = {{ pgbackrest_archive_timeout }}
      # Replika: ambil WAL dari arsip jika tertinggal melewati batas slot
      restore_command = 'pgbackrest --stanza={{ pgbackrest_stanza }} archive-get %f "%p"'
    owner: postgres
    group: postgres
    mode: '0644'
  register: pitr_conf

- name: Restart PostgreSQL agar archive_mode aktif
  ansible.builtin.systemd:
    name: "postgresql@{{ postgres_version }}-main"
    state: restarted
  when: pitr_conf is changed

# ---------------------------------------------------------------------------
# Metrics status arsip (pg_stat_archiver) → Prometheus
# ---------------------------------------------------------------------------
- name: Script metrics arsip WAL
  ansible.builtin.copy:
    dest: /usr/local/sbin/pg-archiver-metrics.sh
    content: |
      #!/usr/bin/env bash
      # Dikelola Ansible (role pgbackrest_db) - pg_stat_archiver → textfile
      set -euo pipefail
      OUT="{{ pgbackrest_textfile_dir }}/pg_archiver.prom"
      row=$(runuser -u postgres -- psql -tAX -F ' ' -c "SELECT pg_is_in_recovery()::int, archived_count, failed_count, coalesce(extract(epoch FROM last_archived_time),0)::bigint, coalesce(extract(epoch FROM last_failed_time),0)::bigint FROM pg_stat_archiver" 2>/dev/null) || exit 0
      read -r rec archived failed last_ok last_fail <<< "$row"
      cat > "$OUT.tmp" <<EOF
      # HELP pg_archiver_is_replica 1 = replika (tidak mengarsip)
      # TYPE pg_archiver_is_replica gauge
      pg_archiver_is_replica $rec
      # HELP pg_archiver_archived_total Segmen WAL berhasil diarsip sejak start
      # TYPE pg_archiver_archived_total counter
      pg_archiver_archived_total $archived
      # HELP pg_archiver_failed_total Percobaan arsip WAL gagal sejak start
      # TYPE pg_archiver_failed_total counter
      pg_archiver_failed_total $failed
      # HELP pg_archiver_last_archived_timestamp_seconds Waktu arsip WAL terakhir sukses
      # TYPE pg_archiver_last_archived_timestamp_seconds gauge
      pg_archiver_last_archived_timestamp_seconds $last_ok
      # HELP pg_archiver_last_failed_timestamp_seconds Waktu arsip WAL terakhir gagal
      # TYPE pg_archiver_last_failed_timestamp_seconds gauge
      pg_archiver_last_failed_timestamp_seconds $last_fail
      EOF
      chmod 0644 "$OUT.tmp"
      mv "$OUT.tmp" "$OUT"
    mode: '0755'

- name: Timer metrics arsip WAL
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    mode: '0644'
  loop:
    - name: pg-archiver-metrics.service
      content: |
        [Unit]
        Description=Metrics arsip WAL PostgreSQL
        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/pg-archiver-metrics.sh
    - name: pg-archiver-metrics.timer
      content: |
        [Unit]
        Description=Jadwal metrics arsip WAL
        [Timer]
        OnBootSec=1min
        OnUnitActiveSec=1min
        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  register: archiver_units

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes
  when: archiver_units is changed

- name: Aktifkan timer metrics arsip WAL
  ansible.builtin.systemd:
    name: pg-archiver-metrics.timer
    enabled: yes
    state: started
