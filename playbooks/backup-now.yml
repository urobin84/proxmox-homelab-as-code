---
# Playbook: jalankan backup manual / on-demand dari Mac admin
#   1. pg_dump di LXC 104
#   2. vzdump semua LXC → BackupFolder (retensi storage ikut diterapkan)
# Eksekusi: ansible-playbook playbooks/backup-now.yml

- name: "Dump PostgreSQL sekarang (LXC 104)"
  hosts: database
  become: yes
  gather_facts: no

  tasks:
    - name: Jalankan pg-backup
      ansible.builtin.systemd:
        name: pg-backup.service
        state: started

- name: "Backup semua LXC sekarang (host pve)"
  hosts: proxmox
  become: yes
  gather_facts: no

  tasks:
    - name: Jalankan vzdump semua LXC
      ansible.builtin.command:
        cmd: >-
          vzdump --all 1
          --storage {{ proxmox_backup_storage | default('BackupFolder') }}
          --mode snapshot --compress zstd
          --notes-template {{ '{{guestname}}' | quote }}
      async: 7200        # maks 2 jam
      poll: 30
      register: vzdump_result

    - name: Tampilkan ringkasan vzdump
      ansible.builtin.debug:
        msg: "{{ vzdump_result.stderr_lines | select('search', 'Finished Backup|ERROR|archive file size') | list }}"
