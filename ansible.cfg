# =============================================================================
# ansible.cfg - Konfigurasi lokal Ansible untuk proyek ini
# =============================================================================

[defaults]
# Inventory default
inventory               = inventory.ini

# Path roles
roles_path              = roles

# Output lebih informatif
stdout_callback         = default
callback_result_format  = yaml
callbacks_enabled       = profile_tasks

# Facts hanya lewat ansible_facts['...'] (default baru ansible-core 2.24)
inject_facts_as_vars    = False

# Percepat koneksi SSH
# Host key dicek; host baru otomatis disimpan (accept-new di ssh_args),
# host key yang BERUBAH ditolak (indikasi MITM / reinstall)
host_key_checking       = True
pipelining              = True
forks                   = 5

# Password Vault diambil dari macOS Keychain (lihat vault-pass.sh)
# Tanpa Keychain: hapus baris ini dan pakai --ask-vault-pass
vault_password_file     = vault-pass.sh

# Log
log_path                = /tmp/ansible-homelab.log

[ssh_connection]
# IdentitiesOnly: hanya pakai key dari inventory, agar key lain di ssh-agent
# tidak menghabiskan jatah MaxAuthTries di server
ssh_args                = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes
control_path            = /tmp/ansible-ssh-%%h-%%p-%%r
pipelining              = True

[privilege_escalation]
become                  = False
become_method           = sudo
